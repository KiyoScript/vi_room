databases:
  - name: vi_room_db
    databaseName: vi_room_db
    user: vi_room_db

services:
  - type: redis
    name: redis-server
    plan: free
    ipAllowList: []
    maxmemoryPolicy: noeviction
  - type: web
    name: viroom-staging
    runtime: ruby
    buildCommand: "./bin/render-build.sh"
    startCommand: "./bin/dev"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vi_room_db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: redis-server
          property: connectionString
